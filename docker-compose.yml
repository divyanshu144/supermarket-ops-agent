services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kirana
      POSTGRES_PASSWORD: kirana
      POSTGRES_DB: kirana
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: ['kirana-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kirana']
      interval: 3s
      retries: 10
volumes:
  kirana-pg:
